<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SAAQ Report</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }
        .report-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        .section {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 20px;
        }
        h2 {
            color: #667eea;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .stage-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 18px;
        }
        .power-center {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }
        .status-strong { color: #4CAF50; font-weight: bold; }
        .status-moderate { color: #FF9800; font-weight: bold; }
        .status-developing { color: #2196F3; font-weight: bold; }
    </style>
</head>
<body>
    <div class="report-header">
        <h1>SkillfullyAware Assessment Report</h1>
        <p id="userName"></p>
        <p id="reportDate"></p>
    </div>

    <div class="section">
        <h2>1. Developmental Stage Estimate</h2>
        <p><span class="stage-badge" id="stageBadge"></span></p>
        <p id="stageDescription"></p>
        <p><strong>Confidence:</strong> <span id="confidence"></span></p>
    </div>

    <div class="section">
        <h2>2. Hemispheric Bias</h2>
        <p id="hemisphericTilt"></p>
        <p id="hemisphericDesc"></p>
    </div>

    <div class="section">
        <h2>3. Power Centers</h2>
        <div id="powerCenters"></div>
    </div>

    <div class="section">
        <h2>4. Core Aptitudes</h2>
        <div id="aptitudes"></div>
    </div>

    <div class="section">
        <h2>5. Shadow Patterns</h2>
        <div id="shadowPatterns"></div>
    </div>

    <div class="section">
        <h2>6. Awareness Summary</h2>
        <p id="summary"></p>
    </div>

    <script>
        // Get report ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const reportId = urlParams.get('id');

        async function loadReport() {
            try {
                const response = await fetch(`http://localhost:8000/api/v1/report/${reportId}`);
                const report = await response.json();
                
                // Populate report
                document.getElementById('userName').textContent = `Name: ${report.user_name}`;
                document.getElementById('reportDate').textContent = `Date: ${new Date(report.report_date).toLocaleDateString()}`;
                
                // Stage
                document.getElementById('stageBadge').textContent = report.stage_diagnosis.center_of_gravity;
                document.getElementById('stageDescription').textContent = report.stage_diagnosis.description;
                document.getElementById('confidence').textContent = (report.stage_diagnosis.confidence * 100).toFixed(0) + '%';
                
                // Hemispheric
                document.getElementById('hemisphericTilt').innerHTML = `<strong>Tilt:</strong> ${report.hemispheric_bias.tilt.toUpperCase()}`;
                document.getElementById('hemisphericDesc').textContent = report.hemispheric_bias.description;
                
                // Power Centers
                const centersHtml = report.power_centers.map(pc => `
                    <div class="power-center">
                        <strong>${pc.name}</strong>
                        <span class="status-${pc.status.toLowerCase()}">${pc.status}</span>
                    </div>
                `).join('');
                document.getElementById('powerCenters').innerHTML = centersHtml;
                
                // Aptitudes
                const aptitudesHtml = report.aptitudes.map(apt => `
                    <div class="power-center">
                        <strong>${apt.name}</strong>
                        <span>${apt.level}</span>
                    </div>
                `).join('');
                document.getElementById('aptitudes').innerHTML = aptitudesHtml;
                
                // Shadow
                document.getElementById('shadowPatterns').innerHTML = `
                    <p><strong>Detected Loops:</strong> ${report.shadow_patterns.loops.join(', ') || 'None detected'}</p>
                    <p><strong>Root Fear:</strong> ${report.shadow_patterns.root_fear}</p>
                    <p><strong>Antidotes:</strong> ${report.shadow_patterns.antidotes.join('; ')}</p>
                `;
                
                // Summary
                document.getElementById('summary').textContent = report.awareness_summary.trim();
                
            } catch (error) {
                alert('Error loading report: ' + error);
            }
        }

        loadReport();
    </script>
</body>
</html>
